name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go build -o media-scanner ./cmd/module
      - name: Create Release
        uses: softprops/action-github-release@v2
        with:
          files: media-scanner
